<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Spotify Wrapped (Anytime)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>My Spotify Wrapped (Anytime)</h1>
    <button id="login-button">Login with Spotify</button>
    <div id="stats" class="hidden">
      <h2>Top Artists</h2>
      <ul id="top-artists"></ul>
      <h2>Top Tracks</h2>
      <ul id="top-tracks"></ul>
    </div>
    <button id="share-button" class="hidden">Share Wrapped</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
